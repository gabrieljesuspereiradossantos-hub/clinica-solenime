<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clínica Solenime | Protocolo Sole em Santo André/SP</title>
    <meta
      name="description"
      content="Clínica Solenime em Santo André/SP. Consulta personalizada do Protocolo Sole, pensado para mulheres que querem se reconhecer no espelho com naturalidade."
    />
    <meta name="theme-color" content="#FBF8F4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clínica Solenime" />
    <meta property="og:locale" content="pt_BR" />
    <!-- Prévia de link (WhatsApp, Instagram, Facebook). VITE_SITE_URL (.env) deve ter o domínio final, sem barra no fim:
         as redes exigem URL absoluta para a imagem. Imagem gerada por scripts/otimizar-fotos.mjs --share. -->
    <meta property="og:title" content="Clínica Solenime | Protocolo Sole em Santo André/SP" />
    <meta
      property="og:description"
      content="Consulta individual para mulheres de 40 a 60 anos que querem rejuvenescer sem exageros e sem perder a identidade."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Recepção da Clínica Solenime, com o letreiro dourado na parede" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- A foto do hero começa a baixar antes do JavaScript (URL fixa em public/fotos) -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="/fotos/recepcao-800.avif 800w, /fotos/recepcao-1600.avif 1600w"
      imagesizes="(min-width: 1024px) 100vw, 260vw"
      fetchpriority="high"
    />
    <!-- Dados para o Google (busca local). Sem nota/avaliações: o Google não aceita marcar avaliações do próprio Google. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HealthAndBeautyBusiness",
        "name": "Clínica Solenime",
        "description": "Clínica de estética em Santo André/SP. Protocolo Sole: consulta individual de rejuvenescimento facial com naturalidade.",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/share.jpg",
        "telephone": "+55 11 95503-9318",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "R. Caminho do Pilar, 828",
          "addressLocality": "Santo André",
          "addressRegion": "SP",
          "postalCode": "09190-000",
          "addressCountry": "BR"
        },
        "hasMap": "https://www.google.com/maps/place/Clinica+Solenime+Est%C3%A9tica/@-23.6694626,-46.5409728,17z/data=!3m1!4b1!4m6!3m5!1s0x94ce43571ffba269:0xf3cb486a4f1380f0!8m2!3d-23.6694626!4d-46.5383979!16s%2Fg%2F11g1llg3vn",
        "geo": { "@type": "GeoCoordinates", "latitude": -23.6694626, "longitude": -46.5383979 },
        "sameAs": ["https://www.instagram.com/clinicasolenime/"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Tela de abertura. Fica no HTML (e não no React) para aparecer antes do JS, sem flash.
      Roda uma vez por sessão; sem JS ela nem aparece. Ao sair, libera a entrada do hero.
    -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fbf8f4;
        color: #3e2e23;
        clip-path: inset(0 0 0 0);
        transition: clip-path 900ms cubic-bezier(0.77, 0, 0.175, 1);
      }
      #loader.is-out {
        clip-path: inset(0 0 100% 0);
      }
      #loader .l-mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        transition:
          transform 800ms cubic-bezier(0.77, 0, 0.175, 1),
          opacity 500ms ease;
      }
      #loader.is-out .l-mark {
        transform: translateY(-32px);
        opacity: 0;
      }
      #loader .l-small {
        font: 500 12px/1 "Cormorant Garamond", Georgia, serif;
        letter-spacing: 0.4em;
        margin-right: -0.4em;
        text-transform: uppercase;
        color: #7a5f48;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 700ms cubic-bezier(0.23, 1, 0.32, 1),
          transform 700ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #loader .l-word {
        font: italic 500 clamp(64px, 9vw, 120px) / 1 "Cormorant Garamond", Georgia, serif;
        letter-spacing: -0.01em;
        margin-top: 4px;
        padding: 0 0.08em 0.14em;
        clip-path: inset(0 100% 0 0);
        transition: clip-path 1200ms cubic-bezier(0.77, 0, 0.175, 1) 150ms;
      }
      #loader .l-line {
        margin-top: 28px;
        width: 128px;
        height: 1px;
        background: #d9c7ae;
        overflow: hidden;
      }
      #loader .l-line i {
        display: block;
        height: 100%;
        background: #80633e;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1400ms cubic-bezier(0.23, 1, 0.32, 1) 300ms;
      }
      #loader .l-foot {
        position: absolute;
        bottom: 40px;
        font: 600 11px/1 Manrope, system-ui, sans-serif;
        letter-spacing: 0.24em;
        margin-right: -0.24em;
        text-transform: uppercase;
        color: #80633e;
        opacity: 0;
        transition: opacity 700ms ease 500ms;
      }
      #loader.is-ready .l-small {
        opacity: 1;
        transform: none;
      }
      #loader.is-ready .l-word {
        clip-path: inset(0 0 0 0);
      }
      #loader.is-ready .l-line i {
        transform: scaleX(0.72);
      }
      #loader.is-ready .l-foot {
        opacity: 1;
      }
      #loader.is-done .l-line i {
        transform: scaleX(1);
        transition-duration: 320ms;
        transition-delay: 0ms;
      }
      #loader.is-out .l-foot {
        opacity: 0;
        transition-delay: 0ms;
        transition-duration: 300ms;
      }
      html.no-loader #loader {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #loader,
        #loader * {
          transition-duration: 1ms !important;
          transition-delay: 0ms !important;
        }
        #loader {
          transition: opacity 200ms ease !important;
        }
        #loader.is-out {
          clip-path: none;
          opacity: 0;
        }
      }
    </style>
    <noscript><style>#loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="loader" aria-hidden="true">
      <div class="l-mark">
        <span class="l-small">clínica</span>
        <span class="l-word">Solenime</span>
        <span class="l-line"><i></i></span>
      </div>
      <span class="l-foot">Santo André/SP</span>
    </div>
    <script>
      (function () {
        var html = document.documentElement;
        var loader = document.getElementById("loader");
        var seen = false;
        try {
          seen = sessionStorage.getItem("solenime-intro") === "1";
        } catch (e) {}
        if (seen || !loader) {
          html.classList.add("no-loader");
          if (loader) loader.remove();
          return;
        }
        // segura a entrada do hero até a cortina subir
        html.classList.add("is-loading");

        var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var MIN = reduce ? 400 : 1700; // tempo para a assinatura terminar de "escrever"
        var MAX = 4000; // nunca prende a visita além disso
        var start = Date.now();
        var finished = false;
        var timeout = function (ms) {
          return new Promise(function (r) {
            setTimeout(r, ms);
          });
        };

        // a assinatura só começa com a fonte certa (ou em 700ms, com a fonte de reserva)
        var font = document.fonts && document.fonts.load ? document.fonts.load('italic 500 1em "Cormorant Garamond"') : Promise.resolve();
        Promise.race([font, timeout(700)]).then(function () {
          requestAnimationFrame(function () {
            loader.classList.add("is-ready");
          });
        });

        function finish() {
          if (finished) return;
          finished = true;
          setTimeout(function () {
            loader.classList.add("is-done");
            setTimeout(function () {
              loader.classList.add("is-out");
              html.classList.remove("is-loading");
              try {
                sessionStorage.setItem("solenime-intro", "1");
              } catch (e) {}
              setTimeout(function () {
                loader.remove();
              }, 1000);
            }, 340);
          }, Math.max(0, MIN - (Date.now() - start)));
        }

        window.addEventListener("load", function () {
          Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), timeout(1200)]).then(finish);
        });
        setTimeout(finish, MAX);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
